<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>左右分栏导航网页</title>
  <style>
    /* 基础重置 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      overflow: hidden;
      background-color: #f1f5f9;
    }

    /* 左侧导航栏 */
    .sidebar {
      width: 240px;
      height: 100%;
      background-color: #1e293b;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      box-shadow: 2px 0 8px rgba(0, 0, 0, 0.1);
    }

    .sidebar-header {
      padding: 24px 20px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #334155;
      text-align: center;
    }

    .nav-list {
      list-style: none;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* 导航链接样式 */
    .nav-item a {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 15px;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .nav-item a:hover {
      background-color: #334155;
      color: #ffffff;
    }

    /* 激活选中的状态 */
    .nav-item a.active {
      background-color: #3b82f6;
      color: #ffffff;
      font-weight: 600;
    }

    /* 右侧网页展示区 */
    .content-area {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: #ffffff;
    }

    .content-frame {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-header">
      系统导航
    </div>
    <ul class="nav-list">
      <li class="nav-item">
        <a href="https://zh.wikipedia.org" target="main-frame" class="active">维基百科</a>
      </li>
      <li class="nav-item">
        <a href="https://example.com" target="main-frame">示例页面</a>
      </li>
      <li class="nav-item">
        <a href="https://httpbin.org" target="main-frame">接口调试页</a>
      </li>
      </ul>
  </aside>

  <main class="content-area">
    <iframe name="main-frame" class="content-frame" src="https://zh.wikipedia.org"></iframe>
  </main>

  <script>
    const navLinks = document.querySelectorAll('.nav-item a');

    navLinks.forEach(link => {
      link.addEventListener('click', function() {
        navLinks.forEach(item => item.classList.remove('active'));
        this.classList.add('active');
      });
    });
  </script>
</body>
</html>
