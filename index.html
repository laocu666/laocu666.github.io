<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMD Pro | 常用命令行汇总</title>
    <style>
        :root {
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --primary: #2d3436;
            --accent: #0984e3;
            --text: #636e72;
            --code-bg: #2d3436;
            --code-text: #fab1a0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--primary);
            line-height: 1.6;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 0;
        }

        header h1 {
            font-size: 2rem;
            letter-spacing: -1px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--accent);
            border-bottom: 2px solid var(--bg);
            padding-bottom: 8px;
        }

        .cmd-item {
            margin-bottom: 12px;
        }

        .cmd-item p {
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 4px;
        }

        code {
            display: block;
            background: var(--code-bg);
            color: var(--code-text);
            padding: 8px 12px;
            border-radius: 6px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.85rem;
            cursor: pointer;
            position: relative;
        }

        code::after {
            content: "点击复制";
            position: absolute;
            right: 10px;
            font-size: 0.7rem;
            opacity: 0.5;
        }

        /* 搜索框样式 */
        .search-container {
            text-align: center;
            margin-bottom: 30px;
        }

        #searchInput {
            width: 100%;
            max-width: 400px;
            padding: 12px 20px;
            border: 2px solid #ddd;
            border-radius: 25px;
            outline: none;
            transition: border-color 0.3s;
        }

        #searchInput:focus {
            border-color: var(--accent);
        }

        @media (max-width: 600px) {
            .container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<header>
    <h1>Terminal Cheat Sheet</h1>
    <p>简洁 · 高效 · 常用命令快速查询</p>
</header>

<div class="search-container">
    <input type="text" id="searchInput" placeholder="搜索命令或功能..." onkeyup="filterCommands()">
</div>

<div class="container" id="cmdContainer">
    <div class="card">
        <h2>Git 版本控制</h2>
        <div class="cmd-item">
            <p>查看状态</p>
            <code onclick="copyText(this)">git status</code>
        </div>
        <div class="cmd-item">
            <p>提交所有更改</p>
            <code onclick="copyText(this)">git commit -am "update"</code>
        </div>
        <div class="cmd-item">
            <p>推送至远程</p>
            <code onclick="copyText(this)">git push origin main</code>
        </div>
    </div>

    <div class="card">
        <h2>Docker 容器</h2>
        <div class="cmd-item">
            <p>查看运行中的容器</p>
            <code onclick="copyText(this)">docker ps</code>
        </div>
        <div class="cmd-item">
            <p>停止所有容器</p>
            <code onclick="copyText(this)">docker stop $(docker ps -aq)</code>
        </div>
    </div>

    <div class="card">
        <h2>Linux 系统</h2>
        <div class="cmd-item">
            <p>查看磁盘占用</p>
            <code onclick="copyText(this)">df -h</code>
        </div>
        <div class="cmd-item">
            <p>实时进程监控</p>
            <code onclick="copyText(this)">htop</code>
        </div>
    </div>

    <div class="card">
        <h2>网络工具</h2>
        <div class="cmd-item">
            <p>查看端口占用</p>
            <code onclick="copyText(this)">lsof -i :8080</code>
        </div>
        <div class="cmd-item">
            <p>测试网络连接</p>
            <code onclick="copyText(this)">ping google.com</code>
        </div>
    </div>
</div>

<script>
    // 点击复制功能
    function copyText(element) {
        const text = element.innerText.replace("点击复制", "").trim();
        navigator.clipboard.writeText(text).then(() => {
            const originalText = element.innerText;
            element.innerText = "已复制！";
            element.style.color = "#55efc4";
            setTimeout(() => {
                element.innerText = originalText;
                element.style.color = "";
            }, 1000);
        });
    }

    // 简单的搜索过滤
    function filterCommands() {
        let input = document.getElementById('searchInput').value.toLowerCase();
        let cards = document.getElementsByClassName('card');
        
        for (let card of cards) {
            let text = card.innerText.toLowerCase();
            card.style.display = text.includes(input) ? "" : "none";
        }
    }
</script>

</body>
</html>
